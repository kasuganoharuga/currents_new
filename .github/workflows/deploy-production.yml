name: Deploy production

# Deploys Currents production ECS after CI succeeds on a main push, or via
# manual workflow_dispatch. The workflow file must live on the default branch
# because workflow_run always uses that copy.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production ECS
    runs-on: ubuntu-latest
    environment: production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )

    env:
      AWS_ACCOUNT_ID: "765332581489"
      AWS_REGION: ap-southeast-2
      AWS_ROLE_ARN: arn:aws:iam::765332581489:role/currents-github-actions-deploy-production
      CLUSTER: currents-production
      SERVICE: currents-production-app
      ECR_REPOSITORY: currents-production/app
      FOUNDATION_STACK: currents-production-foundation
      PRODUCTION_URL: https://currentscommunity.com
      APP_SUBNETS: subnet-01ca3c9f04123576a,subnet-0c2fa11cecac91c62

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve deploy SHA
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          IMAGE_TAG="${{ steps.sha.outputs.sha }}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_BETTER_AUTH_URL="${PRODUCTION_URL}" \
            -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE_URI}"

      - name: Register task definition and update service
        shell: bash
        env:
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          LUMA_WEBHOOK_SECRET: ${{ secrets.LUMA_WEBHOOK_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MEMBER_APPLICATION_CLAIM_SECRET: ${{ secrets.MEMBER_APPLICATION_CLAIM_SECRET }}
          GEONAMES_USERNAME: ${{ secrets.GEONAMES_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${LUMA_API_KEY}" ]; then
            echo "LUMA_API_KEY repository secret is required" >&2
            exit 1
          fi

          for name in BETTER_AUTH_SECRET MEMBER_APPLICATION_CLAIM_SECRET GEONAMES_USERNAME; do
            if [ -z "${!name}" ]; then
              echo "${name} is required for production Join" >&2
              exit 1
            fi
          done

          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET LUMA_WEBHOOK_SECRET; do
            if [ -z "${!name}" ]; then
              echo "warning: ${name} not set; that feature will stay inactive" >&2
            fi
          done

          IMAGE_URI="${{ steps.image.outputs.uri }}"
          IMAGE_TAG="${{ steps.image.outputs.tag }}"

          APP_SECURITY_GROUP="$(aws cloudformation describe-stacks \
            --stack-name "${FOUNDATION_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='AppSecurityGroupId'].OutputValue" \
            --output text)"
          TARGET_GROUP_ARN="$(aws cloudformation describe-stacks \
            --stack-name "${FOUNDATION_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='TargetGroupArn'].OutputValue" \
            --output text)"
          if [ -z "${APP_SECURITY_GROUP}" ] || [ -z "${TARGET_GROUP_ARN}" ]; then
            echo "Missing AppSecurityGroupId or TargetGroupArn from ${FOUNDATION_STACK}" >&2
            exit 1
          fi

          TASK_JSON="$(mktemp)"
          sed "s|REPLACE_TAG|${IMAGE_TAG}|g" \
            infra/aws/prod/task-definition.template.json > "${TASK_JSON}"

          jq \
            --arg image "${IMAGE_URI}" \
            --arg luma_api_key "${LUMA_API_KEY}" \
            --arg luma_webhook_secret "${LUMA_WEBHOOK_SECRET}" \
            --arg better_auth_secret "${BETTER_AUTH_SECRET}" \
            --arg google_client_id "${GOOGLE_CLIENT_ID}" \
            --arg google_client_secret "${GOOGLE_CLIENT_SECRET}" \
            --arg member_application_claim_secret "${MEMBER_APPLICATION_CLAIM_SECRET}" \
            --arg geonames_username "${GEONAMES_USERNAME}" \
            '
              def put($n; $v):
                if ($v | length) == 0 then . else . + [{"name": $n, "value": $v}] end;
              .containerDefinitions |= map(
                if .name == "app" then
                  .image = $image |
                  .environment = (
                    ((.environment // []) | map(select(
                      .name != "LUMA_API_KEY" and
                      .name != "LUMA_WEBHOOK_SECRET" and
                      .name != "BETTER_AUTH_SECRET" and
                      .name != "GOOGLE_CLIENT_ID" and
                      .name != "GOOGLE_CLIENT_SECRET" and
                      .name != "MEMBER_APPLICATION_CLAIM_SECRET" and
                      .name != "GEONAMES_USERNAME"
                    )))
                    | put("LUMA_API_KEY"; $luma_api_key)
                    | put("LUMA_WEBHOOK_SECRET"; $luma_webhook_secret)
                    | put("BETTER_AUTH_SECRET"; $better_auth_secret)
                    | put("GOOGLE_CLIENT_ID"; $google_client_id)
                    | put("GOOGLE_CLIENT_SECRET"; $google_client_secret)
                    | put("MEMBER_APPLICATION_CLAIM_SECRET"; $member_application_claim_secret)
                    | put("GEONAMES_USERNAME"; $geonames_username)
                  )
                else . end
              )
            ' \
            "${TASK_JSON}" > "${TASK_JSON}.next"
          mv "${TASK_JSON}.next" "${TASK_JSON}"

          TASK_ARN="$(aws ecs register-task-definition \
            --cli-input-json "file://${TASK_JSON}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "Registered ${TASK_ARN}"

          echo "Running database migrations..."
          MIGRATE_ARN="$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --task-definition "${TASK_ARN}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${APP_SUBNETS}],securityGroups=[${APP_SECURITY_GROUP}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"app","command":["node","--experimental-strip-types","db/migrate.ts"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)"
          if [ -z "${MIGRATE_ARN}" ] || [ "${MIGRATE_ARN}" = "None" ]; then
            echo "Failed to start migrate task" >&2
            exit 1
          fi
          echo "Migrate task ${MIGRATE_ARN}"
          aws ecs wait tasks-stopped \
            --cluster "${CLUSTER}" \
            --tasks "${MIGRATE_ARN}"
          MIGRATE_EXIT="$(aws ecs describe-tasks \
            --cluster "${CLUSTER}" \
            --tasks "${MIGRATE_ARN}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)"
          echo "Migrate exit code: ${MIGRATE_EXIT}"
          if [ "${MIGRATE_EXIT}" != "0" ]; then
            echo "Database migrations failed" >&2
            exit 1
          fi

          STATUS="$(aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --query 'services[0].status' \
            --output text 2>/dev/null || true)"
          if [ "${STATUS}" != "ACTIVE" ]; then
            aws ecs create-service \
              --cluster "${CLUSTER}" \
              --service-name "${SERVICE}" \
              --task-definition "${TASK_ARN}" \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[${APP_SUBNETS}],securityGroups=[${APP_SECURITY_GROUP}],assignPublicIp=ENABLED}" \
              --load-balancers "targetGroupArn=${TARGET_GROUP_ARN},containerName=app,containerPort=3000" \
              --health-check-grace-period-seconds 90 \
              --deployment-configuration "minimumHealthyPercent=100,maximumPercent=200" \
              --query 'service.serviceArn' \
              --output text
          else
            aws ecs update-service \
              --cluster "${CLUSTER}" \
              --service "${SERVICE}" \
              --task-definition "${TASK_ARN}" \
              --desired-count 1 \
              --force-new-deployment \
              --query 'service.serviceArn' \
              --output text
          fi

          echo "Waiting for service stable..."
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}"
          echo "Service stable."

      - name: Smoke check
        shell: bash
        run: |
          set -euo pipefail
          TARGET_GROUP_ARN="$(aws cloudformation describe-stacks \
            --stack-name "${FOUNDATION_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='TargetGroupArn'].OutputValue" \
            --output text)"
          echo "Target health:"
          aws elbv2 describe-target-health \
            --target-group-arn "${TARGET_GROUP_ARN}" \
            --output table
          healthy="$(aws elbv2 describe-target-health \
            --target-group-arn "${TARGET_GROUP_ARN}" \
            --query "length(TargetHealthDescriptions[?TargetHealth.State=='healthy'])" \
            --output text)"
          if [ "${healthy}" = "0" ]; then
            echo "No healthy targets in ${TARGET_GROUP_ARN}" >&2
            exit 1
          fi

          if ! curl -fsS --connect-timeout 10 "${PRODUCTION_URL}/api/live" >/tmp/currents-live.json; then
            echo "Public smoke skipped: ${PRODUCTION_URL} is not reachable yet (ACM/DNS cutover still pending)."
            exit 0
          fi

          body="$(cat /tmp/currents-live.json)"
          echo "${body}"
          echo "${body}" | grep -q '"status":"ok"' || {
            echo "Expected /api/live to report ok" >&2
            exit 1
          }
          home="$(curl -sS -o /dev/null -w '%{http_code}' "${PRODUCTION_URL}/")"
          echo "GET / -> ${home}"
          if [ "${home}" -ge 500 ]; then
            echo "Home page returned ${home}" >&2
            exit 1
          fi

          events="$(curl -fsS "${PRODUCTION_URL}/api/luma/events")"
          echo "${events}" | jq -e '.events | type == "array"' >/dev/null || {
            echo "Expected /api/luma/events to return an events array" >&2
            exit 1
          }

          health="$(curl -fsS "${PRODUCTION_URL}/api/health")"
          echo "${health}"
          echo "${health}" | grep -q '"status":"ok"' || {
            echo "Expected /api/health to report ok" >&2
            exit 1
          }

          states="$(curl -fsS "${PRODUCTION_URL}/api/geo/states?country=AU")"
          echo "${states}" | jq -e '.states | type == "array" and length > 0' >/dev/null || {
            echo "Expected /api/geo/states to return AU states" >&2
            exit 1
          }
          echo "GET /api/geo/states?country=AU -> ok"

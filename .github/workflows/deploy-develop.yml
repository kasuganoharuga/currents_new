name: Deploy develop

# Deploys Currents develop ECS after CI succeeds on a develop push, or via
# manual workflow_dispatch.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy develop ECS
    runs-on: ubuntu-latest
    environment: develop
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'develop'
      )

    env:
      AWS_ACCOUNT_ID: "765332581489"
      AWS_REGION: ap-southeast-2
      AWS_ROLE_ARN: arn:aws:iam::765332581489:role/currents-github-actions-deploy
      CLUSTER: currents-develop
      SERVICE: currents-develop-app
      ECR_REPOSITORY: currents-develop/app
      DEVELOP_URL: https://develop.currentscommunity.com

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'develop' }}

      - name: Resolve deploy SHA
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          # ECR repository is IMMUTABLE — tag with full commit SHA.
          IMAGE_TAG="${{ steps.sha.outputs.sha }}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build --platform linux/amd64 -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE_URI}"

      - name: Register task definition and update service
        shell: bash
        env:
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          LUMA_WEBHOOK_SECRET: ${{ secrets.LUMA_WEBHOOK_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MEMBER_APPLICATION_CLAIM_SECRET: ${{ secrets.MEMBER_APPLICATION_CLAIM_SECRET }}
          GEONAMES_USERNAME: ${{ secrets.GEONAMES_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${LUMA_API_KEY}" ]; then
            echo "LUMA_API_KEY repository secret is required" >&2
            exit 1
          fi

          for name in BETTER_AUTH_SECRET MEMBER_APPLICATION_CLAIM_SECRET GEONAMES_USERNAME; do
            if [ -z "${!name}" ]; then
              echo "${name} is required for Join on develop" >&2
              exit 1
            fi
          done

          # Google OAuth is optional — V1 Join is the questionnaire only.
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET LUMA_WEBHOOK_SECRET; do
            if [ -z "${!name}" ]; then
              echo "warning: ${name} not set; that feature will stay inactive" >&2
            fi
          done

          IMAGE_URI="${{ steps.image.outputs.uri }}"
          IMAGE_TAG="${{ steps.image.outputs.tag }}"

          TASK_JSON="$(mktemp)"
          sed "s|REPLACE_TAG|${IMAGE_TAG}|g" \
            infra/aws/dev/task-definition.template.json > "${TASK_JSON}"

          jq \
            --arg image "${IMAGE_URI}" \
            --arg luma_api_key "${LUMA_API_KEY}" \
            --arg luma_webhook_secret "${LUMA_WEBHOOK_SECRET}" \
            --arg better_auth_secret "${BETTER_AUTH_SECRET}" \
            --arg google_client_id "${GOOGLE_CLIENT_ID}" \
            --arg google_client_secret "${GOOGLE_CLIENT_SECRET}" \
            --arg member_application_claim_secret "${MEMBER_APPLICATION_CLAIM_SECRET}" \
            --arg geonames_username "${GEONAMES_USERNAME}" \
          '
            def put($n; $v):
              if ($v | length) == 0 then . else . + [{"name": $n, "value": $v}] end;
            .containerDefinitions |= map(
              if .name == "app" then
                .image = $image |
                .environment = (
                  ((.environment // []) | map(select(
                    .name != "LUMA_API_KEY" and
                    .name != "LUMA_WEBHOOK_SECRET" and
                    .name != "BETTER_AUTH_SECRET" and
                    .name != "GOOGLE_CLIENT_ID" and
                    .name != "GOOGLE_CLIENT_SECRET" and
                    .name != "MEMBER_APPLICATION_CLAIM_SECRET" and
                    .name != "GEONAMES_USERNAME"
                  )))
                  | put("LUMA_API_KEY"; $luma_api_key)
                  | put("LUMA_WEBHOOK_SECRET"; $luma_webhook_secret)
                  | put("BETTER_AUTH_SECRET"; $better_auth_secret)
                  | put("GOOGLE_CLIENT_ID"; $google_client_id)
                  | put("GOOGLE_CLIENT_SECRET"; $google_client_secret)
                  | put("MEMBER_APPLICATION_CLAIM_SECRET"; $member_application_claim_secret)
                  | put("GEONAMES_USERNAME"; $geonames_username)
                )
              else . end
            )
          ' \
            "${TASK_JSON}" > "${TASK_JSON}.next"
          mv "${TASK_JSON}.next" "${TASK_JSON}"

          TASK_ARN="$(aws ecs register-task-definition \
            --cli-input-json "file://${TASK_JSON}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "Registered ${TASK_ARN}"

          echo "Running database migrations..."
          MIGRATE_ARN="$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --task-definition "${TASK_ARN}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-0463eda6ac077e977,subnet-07b302fc84ea32325],securityGroups=[sg-07f64e645b2c285d5],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"app","command":["node","--experimental-strip-types","db/migrate.ts"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)"
          if [ -z "${MIGRATE_ARN}" ] || [ "${MIGRATE_ARN}" = "None" ]; then
            echo "Failed to start migrate task" >&2
            exit 1
          fi
          echo "Migrate task ${MIGRATE_ARN}"
          aws ecs wait tasks-stopped \
            --cluster "${CLUSTER}" \
            --tasks "${MIGRATE_ARN}"
          MIGRATE_EXIT="$(aws ecs describe-tasks \
            --cluster "${CLUSTER}" \
            --tasks "${MIGRATE_ARN}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)"
          echo "Migrate exit code: ${MIGRATE_EXIT}"
          if [ "${MIGRATE_EXIT}" != "0" ]; then
            echo "Database migrations failed" >&2
            exit 1
          fi

          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --task-definition "${TASK_ARN}" \
            --force-new-deployment \
            --query 'service.serviceArn' \
            --output text

          echo "Waiting for service stable..."
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}"
          echo "Service stable."

      - name: Smoke check
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS "${DEVELOP_URL}/api/live")"
          echo "${body}"
          echo "${body}" | grep -q '"status":"ok"' || {
            echo "Expected /api/live to report ok" >&2
            exit 1
          }
          home="$(curl -sS -o /dev/null -w '%{http_code}' "${DEVELOP_URL}/")"
          echo "GET / -> ${home}"
          if [ "${home}" -ge 500 ]; then
            echo "Home page returned ${home}" >&2
            exit 1
          fi

          events="$(curl -fsS "${DEVELOP_URL}/api/luma/events")"
          echo "${events}" | jq -e '.events | type == "array"' >/dev/null || {
            echo "Expected /api/luma/events to return an events array" >&2
            exit 1
          }
          event_count="$(echo "${events}" | jq '.events | length')"
          echo "GET /api/luma/events -> ok (${event_count} events)"

          health="$(curl -fsS "${DEVELOP_URL}/api/health")"
          echo "${health}"
          echo "${health}" | grep -q '"status":"ok"' || {
            echo "Expected /api/health to report ok" >&2
            exit 1
          }

          states="$(curl -fsS "${DEVELOP_URL}/api/geo/states?country=AU")"
          echo "${states}" | jq -e '.states | type == "array" and length > 0' >/dev/null || {
            echo "Expected /api/geo/states to return AU states" >&2
            exit 1
          }
          echo "GET /api/geo/states?country=AU -> ok"
